<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tríduo Pascal</title>
  <meta name="description" content="Tríduo Pascal em latim e português: o texto das celebrações, um elemento por página, com as partituras e os áudios de ensaio do coral.">
  <meta name="theme-color" content="#faf6ee">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">

  <script src="js/app.js"></script>
  <script src="dados/audios.js"></script>
